<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LeTaco — Catch the Tacos!</title><meta name="theme-color" content="#191426"><meta name="description" content="Catch tacos, dodge broccoli, and beat your high score in LeTaco!"><style>body{margin:0;background:#191426;color:#ffe6a3;font-family:system-ui;text-align:center}a{color:#ffe6a3}canvas{display:block;width:min(96vw,440px);height:auto;margin:auto;background:#322445;border:4px solid #e7ae39;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;image-rendering:pixelated}button{margin:15px;padding:13px 30px;border:0;border-radius:9px;background:#e7ae39;font-weight:bold;font-size:18px}header{padding:15px}#stats{margin:12px}
*{box-sizing:border-box}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a,button{touch-action:manipulation}button{min-height:48px}a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:700px){header{padding:8px 12px}header a{display:inline-flex;align-items:center;min-height:44px;font-size:14px}h1{font-size:26px;margin:4px 0}header p{font-size:13px;line-height:1.4;margin:6px auto;max-width:34em}#stats{font-size:13px;margin:8px}canvas{width:min(94vw,360px,calc((100svh - 235px)*.6923));min-width:200px;border-width:3px}#play{margin:10px;padding:10px 30px}body>p{font-size:12px;margin:4px 10px 12px}}
@media(max-height:500px) and (orientation:landscape){canvas{width:min(55vw,360px)}}
</style></head><body><header><h1>🌮 LETACO</h1><p>Move the King's pixel head to catch tacos. Catch tacos, avoid broccoli! Three mistakes and you're out!</p></header><div id="stats">Score: 0 | Misses: 0/3 | Personal Best: 0</div><canvas id="game" width="360" height="520"></canvas><button id="play">START</button><button id="sound-toggle" type="button" aria-label="Turn sound off" aria-pressed="true" style="background:#514168;color:#ffe6a3;font-size:14px;padding:10px 18px">🔊 Sound On</button><button id="reset-best" type="button" style="background:#514168;color:#ffe6a3;font-size:14px;padding:10px 18px">Reset High Score</button><p>Tap or drag to guide the King · Arrow keys or A/D on desktop</p><script>
const c=document.getElementById('game'),g=c.getContext('2d'),stats=document.getElementById('stats'),play=document.getElementById('play');g.imageSmoothingEnabled=false;
let initialBest=0,newBestPlayed=false,x=180,targetX=null,activePointer=null,items=[],score=0,miss=0,best=0,running=false,spawn=0,last=0,keys={},runId=0;try{best=Number(localStorage.getItem('letaco-best'))||0}catch{}
// Synthesized original retro/cartoon sounds: no audio downloads or external licenses.
let audio=null,soundOn=true,lastPickupSound=-Infinity;
try{soundOn=localStorage.getItem('letaco-sound')!=='off'}catch{}
const soundButton=document.getElementById('sound-toggle');
function displaySound(){soundButton.textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';soundButton.setAttribute('aria-pressed',String(soundOn));soundButton.setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on')}
function unlockSound(){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{audio=null}}
function beep(freq,duration,type='square',volume=.055,delay=0,endFreq=freq){
 if(!soundOn||!audio||audio.state!=='running')return;
 const t=audio.currentTime+delay,o=audio.createOscillator(),gain=audio.createGain();
 o.type=type;o.frequency.setValueAtTime(Math.max(1,freq),t);o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),t+duration);
 gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(volume,t+.008);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 o.connect(gain);gain.connect(audio.destination);o.start(t);o.stop(t+duration+.01);
}
// Three filtered noise transients give taco pickups a crisp cartoon bite.
let crunchBuffer=null;
function crunch(){
 if(!soundOn||!audio||audio.state!=='running')return;
 const rate=audio.sampleRate;
 if(!crunchBuffer){crunchBuffer=audio.createBuffer(1,Math.ceil(rate*.12),rate);const data=crunchBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1}
 const now=audio.currentTime;
 for(const [offset,duration,volume,frequency] of [[0,.043,.105,2300],[.038,.045,.075,1700],[.084,.032,.045,3100]]){
  const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain(),t=now+offset;
  source.buffer=crunchBuffer;filter.type='highpass';filter.frequency.value=frequency;
  gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(volume,t+.003);
  gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  source.connect(filter);filter.connect(gain);gain.connect(audio.destination);
  source.start(t);source.stop(t+duration);
 }
 beep(170,.085,'triangle',.035,0,110);
}
function sound(which){
 if(which==='start'){beep(330,.10,'square',.035);beep(440,.10,'square',.035,.11);beep(660,.17,'triangle',.055,.23)}
 else if(which==='taco'){if(performance.now()-lastPickupSound<65)return;lastPickupSound=performance.now();crunch()}
 else if(which==='broccoli'){beep(230,.19,'sawtooth',.045,0,95);beep(105,.12,'triangle',.05,.08,70)}
 else if(which==='miss'){beep(410,.21,'sine',.045,0,160)}
 else if(which==='best'){[523,659,784,1047].forEach((f,i)=>beep(f,.14,'triangle',.043,i*.105))}
 else if(which==='over'){[392,294,220,147].forEach((f,i)=>beep(f,.16,'square',.032,i*.13))}
}
soundButton.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('letaco-sound',soundOn?'on':'off')}catch{}displaySound();if(soundOn){unlockSound();beep(660,.09,'triangle',.04)}};displaySound();
function block(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}
const kingSprite=new Image();let spriteReady=false;kingSprite.onload=()=>{spriteReady=true;draw()};kingSprite.src='./letaco-king.svg?v=3';
function king(){if(spriteReady){g.drawImage(kingSprite,Math.round(x-48),Math.round(430-56),96,112)}else{block(x-34,390,68,75,'#21171c');block(x-27,398,54,58,'#b7764b');block(x-20,420,12,8,'#fff');block(x+8,420,12,8,'#fff');block(x-16,442,32,14,'#28181b')}}
function broccoli(t){const xx=t.x,yy=t.y;block(xx-4,yy+2,8,18,'#8dbd59');block(xx-13,yy-7,26,15,'#25783d');block(xx-17,yy-3,12,12,'#328a44');block(xx+5,yy-9,13,16,'#328a44');block(xx-8,yy-12,15,8,'#45a44c');block(xx-10,yy-4,5,5,'#61b757')}
function taco(t){block(t.x-15,t.y,30,11,'#efb64b');block(t.x-12,t.y-5,24,6,'#f9d572');block(t.x-11,t.y-2,22,3,'#58aa54');block(t.x-10,t.y+4,20,3,'#bb5636')}
function draw(){block(0,0,360,520,'#322445');for(let i=0;i<10;i++)block(i*40,55+(i%3)*30,4,4,'#534065');block(0,476,360,44,'#68418c');block(0,473,360,3,'#f4c452');for(const t of items){if(t.bad)broccoli(t);else taco(t)}king();if(!running){block(40,190,280,95,'#20182f');g.fillStyle='#ffe6a3';g.textAlign='center';g.font='bold 22px system-ui';g.fillText(miss>=3?'GAME OVER':'READY, KING?',180,225);g.font='16px system-ui';g.fillText(miss>=3?'You caught '+score+' tacos':'Tap START to play',180,255)}}
function hud(){stats.textContent='Score: '+score+' | Misses: '+miss+'/3 | Personal Best: '+best}
function start(){unlockSound();sound('start');initialBest=best;newBestPlayed=false;runId++;score=0;miss=0;items=[];targetX=null;spawn=0;running=true;last=performance.now();play.textContent='RESTART';hud();requestAnimationFrame(now=>tick(now,runId))}
function tick(now,id){if(!running||id!==runId)return;const dt=Math.min(.05,(now-last)/1000);last=now;const left=keys.ArrowLeft||keys.a,right=keys.ArrowRight||keys.d;if(left||right){targetX=null;if(left)x-=260*dt;if(right)x+=260*dt}else if(targetX!==null){const delta=targetX-x,step=260*dt;if(Math.abs(delta)<=step)x=targetX;else x+=Math.sign(delta)*step}x=Math.max(50,Math.min(310,x));spawn+=dt;if(spawn>Math.max(.35,1.15-score*.018)){spawn=0;items.push({x:25+Math.random()*310,y:-15,bad:Math.random()<.23})}for(const t of items){t.y+=(145+Math.min(230,score*5))*dt;if(t.y>389&&t.y<454&&Math.abs(t.x-x)<42){t.done=true;if(t.bad){miss++;sound('broccoli')}else{score++;sound('taco');if(score>best){best=score;try{localStorage.setItem('letaco-best',String(best))}catch{}if(initialBest>0&&!newBestPlayed){sound('best');newBestPlayed=true}}}}else if(t.y>490){t.done=true;if(!t.bad){miss++;sound('miss')}}}items=items.filter(t=>!t.done);if(miss>=3){running=false;play.textContent='PLAY AGAIN';sound('over')}hud();draw();if(running)requestAnimationFrame(now=>tick(now,id))}
function aim(e){const r=c.getBoundingClientRect();targetX=Math.max(50,Math.min(310,(e.clientX-r.left)*360/r.width))}c.addEventListener('pointerdown',e=>{if(activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;c.setPointerCapture(e.pointerId);aim(e)});c.addEventListener('pointermove',e=>{if(e.pointerId!==activePointer)return;e.preventDefault();aim(e)});function release(e){if(e.pointerId!==activePointer)return;e.preventDefault();activePointer=null;if(c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId)}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);c.addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('selectstart',e=>e.preventDefault());window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!running)start()});window.addEventListener('keyup',e=>keys[e.key]=false);play.onclick=start;document.getElementById('reset-best').onclick=()=>{if(!confirm('Reset your personal best score on this browser?'))return;best=0;try{localStorage.removeItem('letaco-best')}catch{}hud();draw()};hud();draw();
</script></body></html>
